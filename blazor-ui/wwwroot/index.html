<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Word Snippets</title>
    <base href="/" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="assets/icon-16.png" />
</head>
<body>
    <div id="app">
        <!-- Loading indicator shown while Office and Blazor initialise -->
        <div class="init-loading">
            <div class="init-spinner"></div>
            <p>Loading Word Snippets...</p>
        </div>
    </div>

    <!--
        office.js MUST load before Blazor starts.
        GCC note: appsforoffice.microsoft.com is an allowed Microsoft CDN.
        If your environment blocks it, contact your network admin or self-host
        the office.js bundle from the npm package @microsoft/office-js.
    -->
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"
            type="text/javascript"></script>

    <!-- Office interop helpers (Word.run, token acquisition) -->
    <script src="js/officeInterop.js"></script>

    <!--
        Blazor is started MANUALLY after Office.onReady fires.
        This ensures Window._officeHostInfo is set before any Razor component runs.
        autostart="false" prevents Blazor from starting on its own.
    -->
    <script src="_framework/blazor.webassembly.js" autostart="false"></script>

    <script>
        // If running inside an Office host, wait for Office.onReady before starting Blazor.
        // When running in a plain browser (local dev) Office may be undefined; start Blazor immediately.
        function startBlazorWithHostInfo(info) {
            window._officeHostInfo = info;
            Blazor.start().catch(function (err) {
                console.error('Blazor start failed:', err);
                document.getElementById('app').innerHTML =
                    '<div class="error-banner">Failed to load the add-in. Please reload the task pane.</div>';
            });
        }

        if (typeof Office !== 'undefined' && typeof Office.onReady === 'function') {
            Office.onReady(function (info) {
                startBlazorWithHostInfo(info);
            });
        } else {
            // Not in Office host - provide a minimal host info object so components can detect this.
            startBlazorWithHostInfo({ host: 'None', platform: 'Browser', version: 'N/A' });
        }
    </script>

    <script src="_framework/blazor.webassembly.js" autostart="false"></script>
</body>
</html>
